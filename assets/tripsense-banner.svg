<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1D1C"/>
      <stop offset="55%" stop-color="#212C27"/>
      <stop offset="100%" stop-color="#25463B"/>
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E85D2A"/>
      <stop offset="50%" stop-color="#C9933B"/>
      <stop offset="100%" stop-color="#9FE0C4"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Granite to Alpine Moss Canvas -->
  <rect width="1200" height="340" rx="22" fill="url(#bgGrad)"/>

  <!-- Animated Topographic Elevation Contours -->
  <g fill="none" stroke="#FAF9F6" stroke-opacity="0.07" stroke-width="1.3">
    <path d="M-40,260 Q220,180 480,235 T960,195 T1260,245">
      <animate attributeName="d" dur="12s" repeatCount="indefinite"
        values="M-40,260 Q220,180 480,235 T960,195 T1260,245;
                M-40,245 Q220,205 480,215 T960,220 T1260,230;
                M-40,260 Q220,180 480,235 T960,195 T1260,245"/>
    </path>
    <path d="M-40,295 Q280,225 560,275 T1020,230 T1260,280"/>
    <path d="M-40,120 Q300,60 620,115 T1080,80 T1260,125"/>
    <path d="M-40,85 Q340,30 680,80 T1120,45 T1260,90"/>
  </g>

  <!-- Subtle Right Expedition Grid Accent -->
  <g stroke="#E2DDD3" stroke-opacity="0.05" stroke-width="1">
    <line x1="760" y1="30" x2="760" y2="310"/>
    <line x1="920" y1="30" x2="920" y2="310"/>
    <line x1="1080" y1="30" x2="1080" y2="310"/>
    <line x1="690" y1="110" x2="1150" y2="110"/>
    <line x1="690" y1="220" x2="1150" y2="220"/>
  </g>

  <!-- Animated Expedition Route Curve (Chittagong -> Sylhet -> Cox's Bazar -> Dhaka) -->
  <path id="expeditionPath" d="M 730 245 C 805 155, 860 115, 920 140 S 1020 225, 1085 110"
        fill="none" stroke="url(#routeGrad)" stroke-width="3.5" stroke-dasharray="10 7" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="68" to="0" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- Traveling Waypoint Pulse Along Expedition Route -->
  <circle r="6.5" fill="#E85D2A" filter="url(#glow)">
    <animateMotion dur="5.5s" repeatCount="indefinite"
      path="M 730 245 C 805 155, 860 115, 920 140 S 1020 225, 1085 110"/>
  </circle>

  <!-- Beacon Pins -->
  <g>
    <!-- Pin 1: Chittagong -->
    <circle cx="730" cy="245" r="11" fill="#E85D2A" fill-opacity="0.22">
      <animate attributeName="r" values="9;16;9" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="730" cy="245" r="5" fill="#E85D2A" stroke="#FAF9F6" stroke-width="2"/>
    <text x="730" y="270" text-anchor="middle" fill="#D6D1C7" font-family="monospace" font-size="11" font-weight="700">CHITTAGONG</text>

    <!-- Pin 2: Sylhet -->
    <circle cx="920" cy="140" r="10" fill="#C9933B" fill-opacity="0.25">
      <animate attributeName="r" values="8;15;8" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="140" r="5" fill="#C9933B" stroke="#FAF9F6" stroke-width="2"/>
    <text x="920" y="122" text-anchor="middle" fill="#D6D1C7" font-family="monospace" font-size="11" font-weight="700">SYLHET</text>

    <!-- Pin 3: Cox's Bazar -->
    <circle cx="1015" cy="182" r="5" fill="#9FE0C4" stroke="#FAF9F6" stroke-width="2"/>
    <text x="1028" y="204" text-anchor="middle" fill="#9FE0C4" font-family="monospace" font-size="11" font-weight="700">COX'S BAZAR</text>

    <!-- Pin 4: Dhaka -->
    <circle cx="1085" cy="110" r="11" fill="#9FE0C4" fill-opacity="0.24">
      <animate attributeName="r" values="9;16;9" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1085" cy="110" r="5" fill="#9FE0C4" stroke="#FAF9F6" stroke-width="2"/>
    <text x="1085" y="92" text-anchor="middle" fill="#FAF9F6" font-family="monospace" font-size="11" font-weight="700">BANDARBAN</text>
  </g>

  <!-- Left Editorial Branding -->
  <g transform="translate(64, 72)">
    <!-- Status Pill -->
    <rect x="0" y="0" width="322" height="28" rx="14" fill="#25463B" stroke="#386655" stroke-width="1"/>
    <circle cx="18" cy="14" r="4" fill="#9FE0C4">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="18" fill="#A7F3D0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.8">
      FAIRNET NEURAL CONSENSUS • Q1 BENCHMARKED
    </text>

    <!-- Main Title -->
    <text x="0" y="88" fill="#FAF9F6" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="900" letter-spacing="-1">
      Trip<tspan fill="#E85D2A">Sense</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="124" fill="#E2DDD3" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">
      Explainable, Group-Aware &amp; Sustainable Travel Companion
    </text>

    <!-- Feature Chips -->
    <g transform="translate(0, 152)" font-family="monospace" font-size="11" font-weight="700">
      <rect x="0" y="0" width="142" height="28" rx="8" fill="#2A2F2D" stroke="#454D4A"/>
      <text x="12" y="18" fill="#FFAD8F">CLIP + FairNet</text>

      <rect x="152" y="0" width="150" height="28" rx="8" fill="#2A2F2D" stroke="#454D4A"/>
      <text x="164" y="18" fill="#9FE0C4">Neuro-Symbolic RAG</text>

      <rect x="312" y="0" width="150" height="28" rx="8" fill="#2A2F2D" stroke="#454D4A"/>
      <text x="324" y="18" fill="#FDE68A">Nash Veto + Eco</text>
    </g>
  </g>
</svg>
